<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" fill="#1a1a1a">
  <!-- Decorative flower/star symbol -->
  <g transform="translate(45, 50)">
    <!-- Four petals forming a cross/flower shape -->
    <!-- Top petal -->
    <path d="M0,-38 C8,-38 16,-30 16,-18 C16,-8 10,-2 0,0 C-10,-2 -16,-8 -16,-18 C-16,-30 -8,-38 0,-38Z" />
    <!-- Bottom petal -->
    <path d="M0,38 C-8,38 -16,30 -16,18 C-16,8 -10,2 0,0 C10,2 16,8 16,18 C16,30 8,38 0,38Z" />
    <!-- Left petal -->
    <path d="M-38,0 C-38,-8 -30,-16 -18,-16 C-8,-16 -2,-10 0,0 C-2,10 -8,16 -18,16 C-30,16 -38,8 -38,0Z" />
    <!-- Right petal -->
    <path d="M38,0 C38,8 30,16 18,16 C8,16 2,10 0,0 C2,-10 8,-16 18,-16 C30,-16 38,-8 38,0Z" />
    <!-- Diagonal curls - top-right -->
    <path d="M6,-6 C14,-14 22,-20 28,-18 C24,-12 18,-6 6,-6Z" opacity="0.9"/>
    <!-- Diagonal curls - bottom-left -->
    <path d="M-6,6 C-14,14 -22,20 -28,18 C-24,12 -18,6 -6,6Z" opacity="0.9"/>
    <!-- Diagonal curls - top-left -->
    <path d="M-6,-6 C-14,-14 -20,-22 -18,-28 C-12,-24 -6,-18 -6,-6Z" opacity="0.9"/>
    <!-- Diagonal curls - bottom-right -->
    <path d="M6,6 C14,14 20,22 18,28 C12,24 6,18 6,6Z" opacity="0.9"/>
  </g>
  
  <!-- "Apila" text in elegant serif style -->
  <text x="95" y="62" font-family="'Playfair Display', 'Georgia', serif" font-size="64" font-weight="700" letter-spacing="1" fill="#1a1a1a">Apila</text>
  
  <!-- "JEWELS" text below -->
  <text x="142" y="82" font-family="'Inter', 'Arial', sans-serif" font-size="16" font-weight="400" letter-spacing="8" fill="#1a1a1a">JEWELS</text>
</svg>
